<mjml>
  <mj-head>
    <mj-title>{{customer_name}}, tienes un cupón de La Paleta</mj-title>
    <mj-preview>{{benefit}}</mj-preview>
    <mj-attributes>
      <mj-all font-family="'DM Sans', Arial, sans-serif" />
      <mj-section background-color="#fdfcfc" padding="0 36px" />
      <mj-text color="#231e1a" font-size="15px" line-height="1.6" padding="0" />
    </mj-attributes>
  </mj-head>
  <mj-body background-color="#f9f7f5">
    <mj-section background-color="#772222" padding="20px 36px">
      <mj-group>
        <mj-column width="20%" vertical-align="middle"><mj-image src="https://media.base44.com/images/public/69e078117e2725c0776d724e/68efe1372_logoPaletaMesadetrabajo8-111.png" width="48px" padding="0" align="left" alt="La Paleta" /></mj-column>
        <mj-column width="80%" vertical-align="middle"><mj-text color="#ffffff" font-size="18px" font-weight="700">La Paleta</mj-text></mj-column>
      </mj-group>
    </mj-section>
    <mj-section padding="40px 36px 8px"><mj-column>
      <mj-text font-size="30px" font-weight="700" line-height="1.15">¡Hola {{customer_name}}, tienes un regalo!</mj-text>
      <mj-text color="#7e7167" padding="12px 0 0">Te asignamos un cupón para disfrutar en La Paleta.</mj-text>
    </mj-column></mj-section>
    <mj-section padding="24px 36px"><mj-column background-color="#f9f7f5" border-radius="10px" padding="24px">
      <mj-text color="#7e7167" font-size="13px" text-transform="uppercase" letter-spacing="1px">{{title}}</mj-text>
      <mj-text font-size="22px" font-weight="700" color="#772222" padding="8px 0 0">{{benefit}}</mj-text>
      <mj-text padding="12px 0 0">{{description}}</mj-text>
      <mj-text color="#7e7167" font-size="13px" padding="12px 0 0">{{expires_text}}</mj-text>
    </mj-column></mj-section>
    <mj-section padding="0 36px 40px"><mj-column>
      <mj-text>Muestra este correo en tienda para canjearlo.</mj-text>
    </mj-column></mj-section>
    <mj-section background-color="#f9f7f5" padding="20px 36px"><mj-column>
      <mj-text color="#7e7167" font-size="12px" align="center">La Paleta · <a href="{{unsubscribe_url}}" style="color:#7e7167">Darse de baja</a></mj-text>
    </mj-column></mj-section>
  </mj-body>
</mjml>
